# ============================================================================
#  packages/observabilite — journalisation JSON et masquage des secrets
#
#  LOT 1, sous-etape T4, story MVP-L01-US004.
#
#  POURQUOI UN PAQUET PARTAGE PLUTOT QUE DU CODE DUPLIQUE
#
#    Le cahier §28.1 impose le meme format de journal a l'API et au worker, et
#    le §28.2 leur impose la meme interdiction de fuite. Dupliquer le filtre de
#    masquage dans les deux applications serait la pire des options : deux
#    filtres finissent par diverger, et le jour ou l'un des deux oublie un
#    motif, la fuite est silencieuse.
#
#    Une seule implementation, deux consommateurs, une seule suite de tests.
#
#  `packages/` est l'un des sept repertoires imposes par le cahier §15.3, qui
#  ne le reserve pas au JavaScript. `pnpm-workspace.yaml` liste ses membres
#  explicitement : ce paquet Python n'y entre pas par accident.
# ============================================================================

[project]
name = "onboarding-observabilite"
version = "0.1.0"
description = "eXalt Onboarding Digital - journalisation JSON et masquage des secrets."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observabilite"]
