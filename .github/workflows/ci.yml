# ============================================================================
#  Integration continue — les onze controles du cahier des charges 23.1.
#
#  LOT 1, sous-etape T6, story MVP-L01-US005.
#
#  LES ONZE CONTROLES, ENUMERES ET NON COMPTES
#    C'est l'enumeration qui empeche l'omission : la fiche du lot annoncait
#    « 8 controles » la ou le cahier en enumere onze, et tests API, tests
#    frontend et construction des images n'apparaissaient dans aucun decompte
#    inferieur. C'est l'ecart ECART-018.
#
#      1  formatage                         -> make format-check   tache qualite
#      2  lint                              -> make lint           tache qualite
#      3  typage                            -> make typecheck      tache qualite
#      4  tests unitaires                   -> make test-unit      tache qualite
#      5  tests d'integration PostgreSQL    -> make test-integration   tache stack
#      6  tests API                         -> make api-check          tache stack
#      7  tests frontend                    -> make test-frontend  tache qualite
#      8  controle Alembic                  -> make migrate + alembic-check  stack
#      9  detection de secrets              -> gitleaks            tache qualite
#     10  audit de dependances              -> make audit          tache qualite
#     11  construction des images           -> make up             tache stack
#
#  DEUX CONTROLES EN PLUS, recommandes par le lot et devenus effectifs ici :
#    make docs-check recalcule les cinq empreintes SHA-256 des documents
#    immuables (ROAD-RSK-029) et confronte les marqueurs d'identifiant libre au
#    maximum reellement en usage (ECART-021).
#
#  CE QUI N'EST PAS COUVERT ICI, ET IL FAUT LE DIRE
#    - `make persistence-test` : la survie des volumes a un redemarrage est
#      eprouvee a chaque sous-etape en local, mais coute deux cycles complets de
#      la stack. Elle n'entre pas dans les onze controles du cahier ;
#    - Trivy : l'analyse des images publiees releve de T7, qui possede GHCR ;
#    - `pnpm peers check` : hors des onze, et il echouerait sur
#      eslint-plugin-jsx-a11y, dont T5 a prouve par temoin qu'il fonctionne
#      malgre une declaration de compatibilite ESLint perimee.
#
#  EPINGLAGE — meme discipline que DEC-443 pour les images et DEC-456 pour
#  l'outillage. Chaque action est referencee par EMPREINTE DE COMMIT, jamais par
#  etiquette : une etiquette se deplace, une empreinte non. Gitleaks est
#  telecharge et son empreinte SHA-256 verifiee avant execution, comme l'ont ete
#  `gh` en T0 et `uv` en T1.
# ============================================================================

name: Integration continue

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Lecture seule. Aucun secret n'est necessaire a T6 : la publication dans GHCR,
# qui en demandera, appartient a T7.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  # Empreinte publiee par le projet gitleaks pour cette version exacte.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  # --------------------------------------------------------------------------
  #  Tache 1 — qualite et securite. Aucun service, aucun Docker : le retour
  #  arrive vite, sans attendre la construction des images.
  # --------------------------------------------------------------------------
  qualite:
    name: Qualite et securite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le depot avec son historique
        # fetch-depth 0 : Gitleaks doit examiner l'HISTORIQUE, pas seulement
        # l'etat courant. Un secret retire au commit suivant reste dans les
        # objets Git, donc reste une fuite.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installer uv, qui provisionne Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Installer Node a la version epinglee
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activer pnpm par corepack
        # Meme mecanisme qu'en local : la version exacte et son empreinte
        # d'integrite sont lues dans le champ packageManager (DEC-456).
        run: corepack enable pnpm

      - name: Installer les dependances depuis les verrous
        # --frozen / --frozen-lockfile : l'installation ECHOUE si un verrou ne
        # correspond pas aux manifestes, au lieu de le reecrire en silence.
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Versions epinglees et arborescence du cahier 15.3
        run: |
          make versions
          make tree

      - name: Documents immuables et sequences d'identifiants
        # LOT 5. `docs-temoin` est NOMME ici, et pas seulement ajoute a
        # `make check` : ce workflow appelle les cibles UNE PAR UNE et
        # n'invoque jamais `make check` -- §7.36, defaut `T1-5`.
        run: |
          make docs-check
          make docs-temoin

      - name: Aucun fichier source ignore par git
        # LOT 5, T1. STATIQUE : ni demon Docker, ni base -- git et python3
        # suffisent, donc la tache qualite.
        #
        # IL EST NE D'UN DEFAUT MESURE, et le defaut etait SILENCIEUX dans le
        # sens dangereux : le module `apps/api/app/media/` a ete ecrit, ses
        # vingt tests passaient, `make check` est sorti en 0, `make
        # icloud-verify` en 0 -- et `git add -A` NE L'A PAS AJOUTE. La ligne 60
        # de .gitignore portait `media/`, motif ecrit au LOT 0 contre les medias
        # DEPOSES, et qui vaut a toute profondeur : il attrapait le module
        # source du meme nom. La migration et les tests seraient partis SANS le
        # module qu'ils exercent.
        #
        # Tous nos controles lisent le DISQUE ; git lit son INDEX. Deux
        # grandeurs differentes -- §7.0 sixieme proposition appliquee non pas a
        # deux nombres mais a deux SOURCES. C'est pourquoi il est ICI : le
        # moment ou il faut le savoir est la pull request.
        #
        # `sources-temoin` l'eprouve dans les DEUX sens, avec un vrai fichier
        # source a un vrai chemin ignore -- un temoin qui n'exerce pas un
        # controle ne prouve rien de ce controle (§7.25).
        run: |
          make sources-check
          make sources-temoin

      - name: Aucun parametre lie ne sert deux types de colonne differents
        # Pose le 14/09/2026, hors numerotation, apres QUATRE diagnostics de la
        # meme classe -- T4-2 et T8-3 du LOT 2, les six fabriques du meme lot, et
        # T1-2 du LOT 6.
        #
        # POURQUOI IL EST ICI ET NON DANS LA TACHE STACK : il lit les types dans
        # les METADONNEES SQLAlchemy, pas dans le catalogue. Aucune base n'est
        # requise, et le moment ou il faut le savoir est la PULL REQUEST.
        # `make migrations-check` prouve deja que le schema egale ces metadonnees.
        #
        # LE DISCRIMINANT EST LE TYPE, JAMAIS LE TEXTE. Les deux tentatives
        # precedentes echouaient sur du code conforme : l'une sur le COMMENTAIRE
        # expliquant le motif, l'autre sur `:p` partage entre deux colonnes
        # `uuid` -- reutilisation legitime. Mesure du 14/09/2026 : ce depot porte
        # 34 partages LEGITIMES, autant de faux positifs qu'un controle textuel
        # aurait produits.
        #
        # `parametres-temoin` l'eprouve dans les DEUX sens : il exige que le
        # defaut de T1-2 soit VU, et que le partage legitime soit ACCEPTE.
        run: |
          make parametres-check
          make parametres-temoin

      - name: Le cadre applicatif, ses jetons et ses routes internes
        # LOT 4, T3. STATIQUE : aucun demon Docker, donc dans la tache qualite.
        #
        # IL EST NE D'UN DEFAUT MESURE : `auth.css`, posee en T11 du LOT 3,
        # employait 21 proprietes personnalisees dont 14 ne resolvaient RIEN --
        # rien n'importait `jetons.css`. Les huit ecrans rendaient leurs
        # espacements, rayons et typographie avec les defauts du navigateur, et
        # `make ecrans-check` passait : il exigeait qu'aucune couleur LITTERALE
        # ne soit ecrite dans la source, jamais que les jetons RESOLVENT. Le
        # succes d'un controle et la justesse d'une page sont deux grandeurs
        # differentes (§7.24).
        #
        # Il classe aussi CHAQUE feuille du frontend : `verifier-ecrans.py`
        # n'examinait qu'un chemin ecrit en dur, si bien qu'une feuille nouvelle
        # lui echappait. Une feuille non classee fait desormais echouer.
        #
        # `cadre-temoin` l'eprouve, et il exige les DEUX motifs attendus plutot
        # qu'un simple code non nul.
        run: |
          make cadre-check
          make cadre-temoin

      - name: 1 · Formatage
        run: make format-check

      - name: 2 · Lint
        run: make lint

      - name: 3 · Typage
        run: make typecheck

      - name: 4 · Tests unitaires
        run: make test-unit

      - name: 7 · Tests frontend
        run: make test-frontend

      - name: 9 · Detection de secrets
        # Telechargement puis VERIFICATION D'EMPREINTE avant execution. Un
        # binaire de securite installe sans verification est une contradiction.
        # `--exit-code 1` rend l'echec effectif ; `--redact` empeche qu'un
        # secret detecte soit recopie en clair dans les journaux publics de
        # l'execution, ce qui l'aggraverait.
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
          ./gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

      - name: 10 · Audit de dependances
        run: make audit

  # --------------------------------------------------------------------------
  #  Tache 2 — stack reelle. Les huit services demarrent pour de vrai : les
  #  tests d'integration REFUSENT de s'executer sans eux, et c'est voulu — un
  #  test ignore n'est pas un test qui passe.
  # --------------------------------------------------------------------------
  stack:
    name: Stack reelle, migrations et images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resoudre les hotes locaux du projet
        # LINUX NE RESOUT PAS les sous-domaines de `.localhost`, contrairement a
        # macOS. Mesure du 29/07/2026 dans un conteneur Linux reel :
        # `app.onboarding.localhost` -> gaierror, « No address associated with
        # hostname », alors que `localhost` seul se resout. Sans ces deux
        # lignes, `api-check` et `web-check` echoueraient faute de resolution de
        # nom, et non par defaut du livrable. Le controle ci-dessous echoue si
        # la resolution ne fonctionne pas : il ne se contente pas d'ecrire.
        run: |
          set -euo pipefail
          sudo tee -a /etc/hosts >/dev/null <<'FIN'
          127.0.0.1 app.onboarding.localhost
          127.0.0.1 api.onboarding.localhost
          FIN
          getent hosts app.onboarding.localhost
          getent hosts api.onboarding.localhost

      - name: Installer uv, qui provisionne Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Installer les dependances Python depuis le verrou
        # Les 8 tests d'integration s'executent sur l'hote et joignent les
        # services publies sur 127.0.0.1 par la surcouche de developpement.
        run: uv sync --frozen

      - name: 11 · Construction des images et demarrage des huit services
        # `make up` construit api, worker et web, demarre, ATTEND l'etat sain,
        # cree le bucket MinIO, recharge Caddy, puis controle sante et ports.
        # Aucune publication dans GHCR : elle appartient a T7.
        run: make up

      - name: Sante des huit services et publication des ports
        run: make stack-check

      - name: 8 · Controle Alembic
        run: |
          make migrate
          make alembic-check
          make historisation-check
          make privileges-check
          make secrets-check
          make isolation-check
          make isolation-temoin
          make migrations-check

      - name: 6 · Tests API
        run: make api-check

      - name: Page de statut, vue comme un navigateur la voit
        run: make web-check

      - name: Reponse generique du magic link, a travers Caddy en HTTPS
        # LOT 3, T3 — le critere de `MVP-L03-US001` est une EGALITE : la reponse
        # doit etre identique pour une adresse connue et une inconnue, corps et
        # en-tetes compris. Le verifier ICI, sur la stack reelle, est ce qui
        # empeche une divergence d'apparaitre a l'insu de tout le monde : les
        # tests d'integration montent l'application en processus, ce controle
        # interroge ce que le mandataire livre reellement.
        #
        # Il porte son propre temoin — il exige que son comparateur signale deux
        # reponses reellement differentes — et il nettoie ce qu'il cree, base ET
        # Mailpit.
        run: make magic-link-check

      - name: Verrouillage administrateur, a travers Caddy en HTTPS
        # LOT 3, T5 — le critere de `MVP-L03-US003` est double : le verrouillage
        # se declenche ET il se leve. Le RELACHEMENT au bout de quinze minutes est
        # eprouve par les tests, ou l'instant est injecte ; ce controle prouve
        # l'autre moitie, sur la stack reelle : que `make admin-local` leve le
        # verrou. C'est la parade documentee du risque « le verrouillage
        # administrateur bloque Jonathan lui-meme ».
        #
        # Il porte aussi l'egalite des refus — un refus qui dirait « verrouille »
        # apprendrait a un attaquant qu'il a REUSSI son deni de service — et il
        # nettoie tout ce qu'il cree, compte administrateur compris.
        run: make admin-check

      - name: Cookie de session et absence de jeton cote navigateur
        # LOT 3, T6 — le critere du §3 de la fiche est explicite : « les trois
        # attributs sont sur la reponse REELLE, lue a travers Caddy en HTTPS ».
        # Les tests d'integration montent l'application en processus ; ce controle
        # lit ce que le mandataire livre.
        #
        # Il porte aussi le second critere, qu'aucun test d'API ne peut voir :
        # « aucun jeton dans localStorage », par un controle des SOURCES du
        # frontend — exact, pas heuristique, et dont le temoin tourne deja dans
        # `make check`.
        run: make sessions-check

      - name: CSRF et idempotence, a travers Caddy en HTTPS
        # LOT 3, T7 — le critere de `MVP-L03-US005` a deux moities, et chacune a
        # son TEMOIN : « une ecriture sans jeton CSRF est refusee, AVEC TEMOIN »,
        # et « une meme cle d'idempotence rejouee ne produit QU'UN effet ».
        #
        # Le second temoin est celui qu'on oublie : sans lui, l'assertion « un
        # seul lien » serait vraie pour une raison etrangere a l'idempotence.
        # Deux demandes SANS cle doivent donc produire DEUX liens.
        #
        # Ce controle emploie la VRAIE `PUBLIC_BASE_URL` du conteneur : un test
        # qui la surcharge ne prouve rien de la configuration deployee.
        run: make csrf-check

      - name: Limitation de debit, a travers Caddy en HTTPS
        # LOT 3, T8 — « les limites produisent les resultats attendus », critere de
        # sortie litteral du lot. Douze controles, et TROIS temoins :
        #
        #   - les dix premieres demandes passent : sans ce temoin, une route
        #     cassee donnerait la meme observation qu'une limite qui fonctionne ;
        #   - la surveillance d'origine ne refuse JAMAIS : le §20.2 ecrit
        #     « limitation » pour l'adresse et « alerte » pour l'origine, et
        #     confondre les deux verbes bloquerait tout un bureau derriere un
        #     partage d'adresse ;
        #   - un succes efface le compteur d'echecs : sinon un administrateur qui
        #     se trompe puis reussit resterait bloque quinze minutes.
        #
        # Et il compare les DEUX refus, corps et en-tetes : si le 429 n'arrivait
        # que pour une adresse connue, il dirait « ce compte existe » — l'oracle
        # que `T3` a ferme, rouvert par la limite elle-meme.
        run: make debit-check

      - name: Revocation au depart, a travers Caddy en HTTPS
        # LOT 3, T9 — `MVP-L03-US006`, et le controle §30.22 de la recette du
        # modele devient ACQUIS. Six controles, avec TROIS temoins :
        #
        #   - la session repond AVANT le depart : sans lui, un cookie casse
        #     donnerait la meme observation qu'une revocation qui fonctionne ;
        #   - `Active --> Archived` est refusee : le §24.1 n'a pas ce raccourci,
        #     et sans ce refus l'etat `departed` serait decoratif ;
        #   - l'archivage qui SUIT ne trouve plus rien : c'est ce qui prouve que
        #     la revocation tient au DEPART, comme « immediatement » l'exige.
        #
        # Le 401 est mesure par un aller-retour HTTP reel, non deduit de
        # l'ecriture de `revoked_at` : l'ecriture et le refus sont deux grandeurs
        # differentes tant qu'on n'a pas interroge l'API.
        run: make revocation-check

      - name: Comptes de service et scopes
        # LOT 3, T10 — `MVP-L03-US007`. Onze controles, et TROIS temoins : le bon
        # scope passe, un proprietaire technique inconnu est REFUSE plutot que cree,
        # et une duree au-dela du plafond leve plutot que d'etre ecretee.
        #
        # Il passe par `make compte-de-service`, donc par le script reel, et lit le
        # jeton sur sa sortie — ce qui prouve au passage qu'il n'y figure QU'UNE
        # fois. Et il verifie `SERVICE_TOKEN_MAX_DAYS` DANS le conteneur : `T7` a
        # montre qu'une variable qui ne traverse pas la frontiere de processus
        # produit un echec dont le message ne nomme pas la cause.
        run: make service-check

      - name: Les huit ecrans d'authentification, a travers Caddy en HTTPS
        # LOT 3, T11. Sept controles, et le plus utile est le quatrieme : il
        # EXERCE pour la premiere fois le repli `try_files` du `Caddyfile`, pose
        # en T7 du LOT 1 qui l'anticipait mais n'avait jamais eu de chemin a
        # replier. C'est le §7.16 — ce qui n'a jamais tourne n'est pas eprouve.
        #
        # Le TYPE MIME fait foi, jamais le code : Vite rend 200 + index.html pour
        # tout chemin inconnu (§7.10), donc un 200 seul ne prouverait rien.
        #
        # Et il verifie que `/api/*` NE recoit PAS l'artefact statique : un repli
        # SPA qui deborderait sur l'API repondrait 200 a sa place, ce que
        # `DEC-470` interdit.
        run: make ecrans-check

      - name: Les sept evenements du 10.6, par des appels HTTP reels
        # LOT 3, T12 — `MVP-L03-US008`. Six controles. Les sept types ne sont pas
        # INSERES : ils sont produits par la demande d'un lien, sa consommation,
        # une connexion, un echec, un verrouillage, une revocation et un
        # changement de mot de passe. Inserer sept lignes prouverait que la table
        # accepte sept valeurs, pas que les actions les produisent.
        #
        # Le compte des sept est IMPORTE de `TypeEvenementAuth` : un huitieme type
        # ajoute au code ferait echouer ce controle, et c'est son role.
        #
        # Et il porte son TEMOIN : un mot de passe est insere expres dans
        # `auth_event`, et le controle doit le trouver. Sans cela, l'absence
        # prouverait l'absence de controle plutot que l'absence de fuite.
        run: make evenements-check

      - name: Le portail national ne propose QUE des entites actives
        # LOT 4, T1 — `MVP-L04-US001`. Dix controles, a travers Caddy en HTTPS.
        #
        # IL EXAMINE LES QUATRE ETATS DU MODELE, ET IL DIT COMBIEN. Le critere de
        # la fiche n'en nommait que DEUX -- `suspended` et `archived` -- alors que
        # `StatutEntite` en declare quatre : `draft` etait le troisieme etat non
        # actif, et le suivre a la lettre aurait laisse une entite en brouillon sur
        # la page nationale AVEC UN CRITERE QUI SE LIT SATISFAIT. C'est ECART-039,
        # et c'est le §7.34 -- un motif ecrit contre un exemple ne couvre que cet
        # exemple. La liste est donc DERIVEE de l'enumeration, jamais recopiee.
        #
        # IL PORTE TROIS TEMOINS, et chacun repond a un echec qui produirait la
        # meme observation qu'un succes :
        #   la connexion REUSSIT et pose un cookie -- sans quoi une liste vide
        #     serait indistinguable d'un filtrage correct ;
        #   l'entite ACTIVE est rendue -- sans quoi les trois exclusions seraient
        #     satisfaites par une route qui ne rend jamais rien ;
        #   les deux refus sont COMPARES, corps ET en-tetes, la correlation etant
        #     FIXEE plutot qu'un champ exclu. Seul `date` echappe -- l'horloge de
        #     Caddy -- et le controle ANNONCE en sortie ce qu'il n'a pas compare.
        run: make entites-check

      - name: La page Framework, trois familles de cartes
        # LOT 6, T2, story MVP-L06-US001.
        #
        # QUI LIT : la matrice §5, ligne « Framework », accorde la Lecture aux
        # HUIT roles authentifies sans distinction, `EMP` et `NEW` compris, et la
        # refuse a `ANON`. L'ANNEXE A §10.1 N'A NI COLONNE `EMP` NI COLONNE
        # `NEW` : la lire seule aurait exclu l'acteur que la story nomme. Meme
        # piege que la colonne `OFFICE` du §6.1 au LOT 5.
        #
        # SON CONTROLE LE PLUS UTILE N'EST PAS UN REFUS : c'est la recherche de
        # la chaine « None » dans les OCTETS servis. Le defaut T10-8 l'a servie
        # sur 100 % des cercles pendant deux lots, et aucun controle de forme ne
        # l'a vue -- un jeton « None » est parfaitement plausible. Le decor porte
        # un cercle AVEC jeton et un cercle SANS.
        run: make framework-check

      - name: Le trombinoscope pagine, servi a travers Caddy
        # LOT 5, T2, story MVP-L05-US001.
        #
        # SON CONTROLE LE PLUS UTILE EST UN TEMOIN, PAS UN REFUS. Ma premiere
        # version typait `taille` en Literal[25, 50, 100] ; un parametre d'URL
        # arrive en CHAINE, et Pydantic refuse « 25 » contre un Literal
        # d'entiers. La route refusait donc les TROIS tailles valides des
        # qu'elles etaient ecrites -- et les HUIT epreuves de refus passaient
        # toutes, puisqu'elles demandaient un refus et l'obtenaient, pour la
        # mauvaise raison. Seul le temoin qui exige que 25, 50 et 100 SOIENT
        # servies discrimine les deux situations. Defaut T2-3, §7.0.
        #
        # LA PAGINATION EST PROUVEE PAR RECOMPOSITION : compter 25 lignes sur
        # une page ne prouve rien, un ordre non total rendant le meme compte
        # tout en repetant des lignes. Le controle parcourt toutes les pages et
        # exige que chaque identifiant apparaisse UNE fois. Le decor porte des
        # HOMONYMES, sans quoi le tri par nom suffirait et le troisieme critere
        # -- la cle primaire -- ne serait pas exerce.
        #
        # DEUX FILTRES, ET AUCUN N'EST REDONDANT : `departed` et `archived`
        # gardent `published` dans le decor, parce que c'est l'etat REEL de la
        # base apres un depart -- le §22.5 etape 5 « masquage du profil » n'est
        # implemente nulle part.
        run: make trombinoscope-check

      - name: La fiche profil, servie a travers Caddy
        # LOT 5, T4, story MVP-L05-US004.
        #
        # SON CONTROLE LE PLUS UTILE RELIE LA FICHE A LA LISTE. Le trombinoscope
        # exclut quatre etats ; si la fiche etait accessible pour un profil que la
        # liste refuse, le filtre de la liste serait DECORATIF -- et aucun
        # controle de la liste seule ne le verrait. Le controle prend donc
        # l'identifiant que la LISTE rend, verifie que sa fiche est servie, puis
        # prend un profil exclu et exige le MEME 404 qu'un identifiant inconnu.
        # Eprouve : en retirant le filtre de population, il rend « 200/404 ».
        #
        # ET L'ABSENCE DE MASQUAGE EST EPROUVEE, PAS SUPPOSEE. La matrice ne
        # definit aucune visibilite par champ -- ECART-051 -- et le controle
        # appelle avec un compte sans appartenance, sans responsabilite et sans
        # role technique, en exigeant que les SIX champs sensibles du §10.2 soient
        # tous renseignes.
        run: make profil-check

      - name: 4bis · Le changement d'entite recharge les droits, sans en transferer
        # LOT 4, T8 — story `MVP-L04-US002`. Les CINQ regles du cahier §23.3 et de
        # la matrice §23.3 deviennent exigibles ici, et la matrice §5.1 donne la
        # regle entiere : hors de son entite principale, une personne « possede
        # UNIQUEMENT les droits `EMP` ».
        #
        # QUINZE CONTROLES, ET LE DECOR EST CONCU POUR QUE CHAQUE ECHEC PRODUISE
        # UNE OBSERVATION DIFFERENTE DU SUCCES -- en deux appels seulement :
        #   entite A, principale   ESM actif           -> attendu PRESENT
        #                          ENTITY_ADMIN actif  -> attendu PRESENT
        #                          OFFICE_MANAGER clos -> attendu ABSENT (§24.12)
        #                          DSM futur           -> attendu ABSENT
        #   entite B, autre        ENTITY_ADMIN actif   -> attendu ABSENT (§5.1)
        #
        # LE DROIT DE B EXISTE VRAIMENT EN BASE, et un controle le VERIFIE avant :
        # sans lui, l'absence de `ADM-E` dans B serait indistinguable d'une absence
        # de donnee. C'est la difference entre « un role absent est absent » et « un
        # role PRESENT ne s'applique pas ».
        #
        # ET LES REGLES 1 ET 2 SONT DES INTERDICTIONS D'ECRITURE, donc on ne les
        # croit pas : les quatre tables de rattachement sont relevees par empreinte
        # md5 AVANT et APRES le parcours, et comparees. L'empreinte porte son propre
        # temoin -- si elle ne bougeait pas apres huit insertions, elle ne mesurerait
        # rien. Ce qui change PAR CONCEPTION est nomme en sortie, pas tu :
        # `user_session.last_activity_at`, entorse acceptee par `DEC-531`.
        run: make permissions-check

      - name: 4ter · Le catalogue, les modeles et le suivi de l'onboarding, sur la pile reelle
        # LOT 7, T14 — differe explicitement par T13 pour etre combine ici.
        #
        # LE TEMOIN CENTRAL EST L'ASYMETRIE DSM/ESM : un DSM ne gere que SES
        # propres modeles, un ESM tous ceux de l'entite (matrice §9). Les deux
        # roles sont poses dans la MEME entite, et chacun doit voir un ensemble
        # DIFFERENT — un controle a un seul role verrait la meme reponse quel
        # que soit le defaut.
        #
        # LE CYCLE DE VIE COMPLET EST EXERCE UNE FOIS, EN VRAI : creer, composer
        # les taches, publier, archiver, restaurer — chaque transition change
        # le code HTTP attendu de la suivante, donc un service bloque sur un
        # etat produit un ECHEC visible, jamais un succes muet.
        #
        # `ECART-066` EST EPROUVE DANS LE SENS DU REFUS : le DSM est refuse
        # (403) en restaurant SON PROPRE modele — exclu EN BLOC de cette seule
        # ligne du §9, a la difference des cinq autres gestes de la meme grille.
        run: make onboarding-check

      - name: 4bis · Evenements et accueil sur la pile reelle
        # LOT 8, T13 — §7.36 : une cible ajoutee a `make check` n'entre PAS
        # dans la CI de ce projet tant qu'elle n'est pas nommee ICI.
        #
        # LE TEMOIN CENTRAL : la grille a DEUX VISAGES du DSM pour le MEME
        # role — « Modifier » accepte « cree OU rattache », « Publier »/
        # « Annuler »/« Archiver »/« Gerer les medias » n'acceptent QUE
        # « Perimetre » (nomme par `event_dsm_scope`, ECART-067). Deux
        # evenements DSM sont poses pour que le controle puisse DISTINGUER
        # les deux grilles, jamais un seul (§7.0, quatrieme proposition).
        #
        # ARB-DROIT-003 est eprouve dans le sens du refus sur DEUX evenements
        # (celui du Booster, celui du DSM nomme) : DSM et BOOST sont exclus
        # EN BLOC de la restauration, meme sur l'evenement dont ils sont
        # respectivement le createur nomme et le Booster rattache.
        run: make accueil-check

      - name: 4ter · Back-office — asymetrie de roles et isolation multi-entites
        # LOT 9, T15 — §7.36 : une cible ajoutee a `make check` n'entre PAS
        # dans la CI de ce projet tant qu'elle n'est pas nommee ICI.
        #
        # PARTIE A, LE TEMOIN CENTRAL : le tableau de bord (T5) vu par un DSM
        # (portee Consultants) et par l'ESM (portee Entite), DANS LA MEME
        # ENTITE, sur les MEMES donnees — `profils_actifs` DIFFERE (1 contre
        # 5), sans quoi la portee serait decorative (§7.0, quatrieme
        # proposition). Trois autres paires role-refuse / role-accepte sur la
        # MEME action : le depot d'import, la creation d'entite (SUPER seul),
        # le catalogue des metiers (T14, aucun role distingue).
        #
        # PARTIE B, CRITERE DE SORTIE 6 DE LA FICHE LOT 9 : l'isolation multi-
        # entites pendant l'import. Le lot depose par l'ESM de l'entite A est
        # vise par l'ESM de l'entite B sur les trois routes scopees par lot
        # (rapport, lancement, rejeu) — chacune refuse (404) depuis B, quel
        # que soit l'etat du lot. Le temoin le plus discriminant : la MEME
        # ligne, le MEME lot, rejoues depuis A rendent 409 (anomalie d'e-mail,
        # hors de portee du rejeu) et depuis B rendent 404 (lot introuvable)
        # — la preuve que seule l'entite, jamais l'etat ni le role, discrimine.
        run: make back-office-check

      - name: 5 · Tests d'integration, ET la preuve qu ils ne laissent rien
        # LOT 3, T12 — `make residu-check` REMPLACE `make test-integration`, il ne
        # s'y ajoute pas : lancer la suite deux fois doublerait cinquante secondes
        # pour rien. Son code de sortie porte les DEUX verdicts.
        #
        # POURQUOI IL EXISTE : sept occurrences de la meme classe de defaut dans ce
        # seul lot, dont une commise UNE SOUS-ETAPE APRES avoir ecrit la lecon. Le
        # §7.2 dit quoi faire : quand une classe d'erreur resiste a la vigilance,
        # change d'outil au lieu de promettre d'etre plus attentif.
        #
        # La mesure est EXACTE, pas heuristique : un avant/apres table par table,
        # la liste des tables etant derivee du catalogue. Aucune liste de
        # marqueurs, qui vieillirait au premier ajout.
        run: make residu-check

      - name: Journaux des services en cas d'echec
        if: failure()
        run: |
          make ps || true
          docker compose --env-file .env \
            -f infra/compose/docker-compose.base.yml \
            -f infra/compose/docker-compose.dev.yml \
            logs --tail=120 --no-color || true

  # --------------------------------------------------------------------------
  #  Porte unique. C'est CE contexte que la protection de branche exige, et non
  #  la liste des taches : ajouter ou renommer une tache ne demande alors aucun
  #  reglage cote GitHub, et aucune tache ne peut disparaitre sans que la porte
  #  le voie.
  # --------------------------------------------------------------------------
  porte:
    name: Porte de l integration continue
    runs-on: ubuntu-latest
    needs: [qualite, stack]
    if: always()
    steps:
      - name: Recapituler et conclure
        env:
          RESULTAT_QUALITE: ${{ needs.qualite.result }}
          RESULTAT_STACK: ${{ needs.stack.result }}
        run: |
          set -euo pipefail
          echo "  Les onze controles du cahier des charges 23.1"
          echo "    1  formatage                       tache qualite"
          echo "    2  lint                            tache qualite"
          echo "    3  typage                          tache qualite"
          echo "    4  tests unitaires                 tache qualite"
          echo "    5  tests d'integration PostgreSQL  tache stack"
          echo "    6  tests API                       tache stack"
          echo "    7  tests frontend                  tache qualite"
          echo "    8  controle Alembic                tache stack"
          echo "    9  detection de secrets            tache qualite"
          echo "   10  audit de dependances            tache qualite"
          echo "   11  construction des images         tache stack"
          echo
          echo "  qualite : ${RESULTAT_QUALITE}"
          echo "  stack   : ${RESULTAT_STACK}"
          echo
          attendus=2
          reussis=0
          [ "${RESULTAT_QUALITE}" = "success" ] && reussis=$((reussis + 1))
          [ "${RESULTAT_STACK}" = "success" ] && reussis=$((reussis + 1))
          echo "  taches attendues : ${attendus}   reussies : ${reussis}"
          if [ "${reussis}" -ne "${attendus}" ]; then
            echo "  ECHEC : les onze controles ne sont pas tous verts" >&2
            exit 1
          fi
          echo "  --> les onze controles du cahier 23.1 sont verts"
