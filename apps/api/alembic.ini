; Configuration Alembic — eXalt Onboarding Digital
;
; LOT 1, sous-etape T3, story MVP-L01-US003.
;
; L'URL de connexion n'est PAS ecrite ici : elle est construite dans env.py
; depuis les variables d'environnement, comme l'exige le cahier §20.3. Une URL
; en dur dans ce fichier contiendrait un mot de passe et serait versionnee.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; Les fichiers de migration sont prefixes par un numero de sequence, non par un
; horodatage : l'ordre de lecture du repertoire correspond alors a l'ordre
; d'application, ce qui rend une revue de migrations lisible.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generique

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generique

[formatter_generique]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
