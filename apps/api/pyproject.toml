# ============================================================================
#  apps/api - API FastAPI
#
#  LOT 1, sous-etape T1, story MVP-L01-US001 : squelette et outillage seuls.
#  L'application FastAPI, les trois healthchecks et la migration Alembic
#  initiale relevent de la sous-etape T3.
#
#  La configuration de Ruff, de mypy et de pytest est portee par le
#  pyproject.toml racine : une seule source pour tout le workspace.
# ============================================================================

[project]
name = "onboarding-api"
version = "0.1.0"
description = "eXalt Onboarding Digital - API FastAPI (squelette, LOT 1 T1)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "onboarding-observabilite",
    "alembic>=1.18.5",
    "boto3>=1.43.57",
    "fastapi>=0.140.7",
    #  LOT 11, T2 : la verification de contenu reel et la generation des
    #  variantes (§16.1/§16.2) exigent un decodeur d'image. Premiere
    #  dependance de traitement d'image du projet — mesure du 06/09/2026
    #  (media/photo.py) : zero occurrence de Pillow ou vips avant ce lot.
    #  Les roues officielles embarquent deja libjpeg/libpng/libwebp pour
    #  linux/amd64 ET linux/arm64 : aucun paquet systeme supplementaire.
    "pillow>=11.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.20",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
