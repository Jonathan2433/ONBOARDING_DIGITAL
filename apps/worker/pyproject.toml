# ============================================================================
#  apps/worker - worker Dramatiq
#
#  LOT 1, sous-etape T1, story MVP-L01-US001 : squelette et outillage seuls.
#  Le demarrage Dramatiq et la declaration des sept files relevent de T3
#  et T4 ; la persistance des jobs, l'outbox et l'idempotence du LOT 11.
#
#  La configuration de Ruff, de mypy et de pytest est portee par le
#  pyproject.toml racine.
# ============================================================================

[project]
name = "onboarding-worker"
version = "0.1.0"
description = "eXalt Onboarding Digital - worker Dramatiq (squelette, LOT 1 T1)."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
